<div class="fade-in">
  <div class="auth-card" style="max-width: 500px; margin: 0 auto;">
    <div class="auth-header">
      <h2>Add New Item</h2>
      <p>Keep track of your items and stay organized</p>
    </div>

    <div *ngIf="successMessage" class="success-msg" style="margin-bottom: 1.5rem; text-align: center; color: var(--success);">
      ✓ {{ successMessage }}
    </div>

    <div *ngIf="errorMessage" class="error-message" style="margin-bottom: 1.5rem; text-align: center;">
      {{ errorMessage }}
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="name">Item Name</label>
        <div class="input-wrapper">
          <input
            type="text"
            id="name"
            formControlName="name"
            placeholder="e.g., Milk, Bread, Medicine"
          />
        </div>
        <div *ngIf="nameControl?.invalid && nameControl?.touched" class="error-message">
          <small *ngIf="nameControl?.errors?.['required']">Item name is required</small>
        </div>
      </div>

      <div class="form-group">
        <label for="expiryDate">Expiry Date</label>
        <div class="input-wrapper">
          <input
            type="date"
            id="expiryDate"
            formControlName="expiryDate"
            [min]="getMinDate()"
          />
        </div>
        <div *ngIf="expiryDateControl?.invalid && expiryDateControl?.touched" class="error-message">
          <small *ngIf="expiryDateControl?.errors?.['required']">Expiry date is required</small>
        </div>
      </div>

      <div style="display: flex; gap: 1rem; margin-top: 2rem;">
        <button
          type="submit"
          class="btn btn-primary"
          [disabled]="isSubmitting || form.invalid"
        >
          {{ isSubmitting ? 'Adding...' : 'Add Item' }}
        </button>
        <button
          type="button"
          class="btn btn-logout"
          style="width: 100%;"
          (click)="onCancel()"
          [disabled]="isSubmitting"
        >
          Cancel
        </button>
      </div>
    </form>
  </div>
</div>
